<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>Daily English Quiz</title>
    <style>
      :root {
        --bg: #f7f8f6;
        --surface: #ffffff;
        --ink: #1c2420;
        --muted: #5b6660;
        --line: #dde2dc;
        --accent: #0f766e;
        --accent-ink: #0b5a54;
        --accent-soft: #e3f2ef;
        --correct: #15803d;
        --correct-soft: #e6f4ea;
        --wrong: #b91c1c;
        --wrong-soft: #fbe9e9;
        --shadow: 0 1px 3px rgba(20, 30, 25, 0.07);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #121614;
          --surface: #1b201d;
          --ink: #e8ede9;
          --muted: #9aa79e;
          --line: #313832;
          --accent: #2dd4bf;
          --accent-ink: #5eead4;
          --accent-soft: #12302c;
          --correct: #4ade80;
          --correct-soft: #12291a;
          --wrong: #f87171;
          --wrong-soft: #331818;
          --shadow: 0 1px 3px rgba(0, 0, 0, 0.4);
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans", "Noto Sans SC", "Microsoft YaHei", sans-serif;
        line-height: 1.55;
        -webkit-tap-highlight-color: transparent;
      }
      .wrap {
        max-width: 680px;
        margin: 0 auto;
        padding: 20px 16px 48px;
      }
      header { margin-bottom: 18px; }
      h1 {
        font-size: 22px;
        margin: 0 0 6px;
        letter-spacing: 0.2px;
      }
      .instr {
        color: var(--muted);
        font-size: 14px;
        margin: 0;
      }
      .progress {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 14px 0 4px;
        font-size: 14px;
        color: var(--muted);
      }
      .progress .bar {
        flex: 1;
        height: 6px;
        border-radius: 3px;
        background: var(--line);
        overflow: hidden;
      }
      .progress .bar i {
        display: block;
        height: 100%;
        width: 0%;
        background: var(--accent);
        transition: width 0.25s ease;
      }
      h2.section {
        font-size: 16px;
        margin: 26px 0 10px;
        padding-bottom: 6px;
        border-bottom: 2px solid var(--accent);
        color: var(--accent-ink);
      }
      .passage {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 14px 16px;
        font-size: 15px;
        line-height: 1.7;
        box-shadow: var(--shadow);
        margin-bottom: 12px;
      }
      .passage p { margin: 0; }
      .q {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 16px;
        margin-bottom: 12px;
        box-shadow: var(--shadow);
      }
      .q-text {
        font-size: 16px;
        margin: 0 0 12px;
        font-weight: 500;
      }
      .q-num {
        display: inline-block;
        font-size: 12px;
        font-weight: 700;
        color: var(--accent-ink);
        background: var(--accent-soft);
        border-radius: 4px;
        padding: 2px 7px;
        margin-right: 8px;
        vertical-align: 2px;
      }
      .opts { display: grid; gap: 8px; }
      .opt {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        width: 100%;
        text-align: left;
        font: inherit;
        font-size: 15px;
        color: var(--ink);
        background: var(--bg);
        border: 1.5px solid var(--line);
        border-radius: 8px;
        padding: 13px 14px;
        min-height: 52px;
        cursor: pointer;
        transition: border-color 0.15s ease, background 0.15s ease;
      }
      .opt .letter {
        flex: none;
        width: 24px;
        height: 24px;
        border-radius: 50%;
        border: 1.5px solid var(--line);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 13px;
        font-weight: 700;
        color: var(--muted);
        margin-top: 1px;
      }
      .opt.sel {
        border-color: var(--accent);
        background: var(--accent-soft);
      }
      .opt.sel .letter {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      @media (prefers-color-scheme: dark) {
        .opt.sel .letter { color: #0b201d; }
      }
      .opt:disabled { cursor: default; opacity: 1; }
      .opt.is-correct {
        border-color: var(--correct);
        background: var(--correct-soft);
      }
      .opt.is-correct .letter {
        background: var(--correct);
        border-color: var(--correct);
        color: #fff;
      }
      .opt.is-wrong {
        border-color: var(--wrong);
        background: var(--wrong-soft);
      }
      .opt.is-wrong .letter {
        background: var(--wrong);
        border-color: var(--wrong);
        color: #fff;
      }
      .feedback {
        display: none;
        margin-top: 12px;
        font-size: 14px;
        line-height: 1.6;
        border-top: 1px dashed var(--line);
        padding-top: 10px;
      }
      .feedback.show { display: block; }
      .feedback .verdict { font-weight: 700; }
      .feedback .verdict.ok { color: var(--correct); }
      .feedback .verdict.no { color: var(--wrong); }
      .feedback .why { color: var(--muted); display: block; margin-top: 2px; }
      .actions {
        display: flex;
        gap: 10px;
        margin-top: 22px;
      }
      .btn {
        flex: 1;
        font: inherit;
        font-size: 16px;
        font-weight: 600;
        border-radius: 10px;
        padding: 14px;
        cursor: pointer;
        border: none;
      }
      .btn-primary { background: var(--accent); color: #fff; }
      @media (prefers-color-scheme: dark) {
        .btn-primary { color: #0b201d; }
      }
      .btn-primary:disabled { opacity: 0.45; cursor: not-allowed; }
      .btn-ghost {
        background: var(--surface);
        color: var(--ink);
        border: 1.5px solid var(--line);
        flex: 0 0 auto;
        padding: 14px 20px;
      }
      .result {
        display: none;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 18px;
        margin-bottom: 18px;
        box-shadow: var(--shadow);
        text-align: center;
      }
      .result.show { display: block; }
      .result .score {
        font-size: 34px;
        font-weight: 800;
        margin: 0;
      }
      .result .band {
        font-size: 17px;
        font-weight: 700;
        color: var(--accent-ink);
        margin: 6px 0 2px;
      }
      .result .note {
        font-size: 13px;
        color: var(--muted);
        margin: 2px 0 0;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <h1>Daily English Quiz · Day 3 · 2026-10-26</h1>
        <p class="instr">点选每题答案，每题只能选一个；全部选完后点「提交批改」。建议限时 15 分钟，不查词典。</p>
        <div class="progress">
          <span id="progressText">已答 0 / 20</span>
          <span class="bar"><i id="progressBar"></i></span>
        </div>
      </header>

      <div class="result" id="result">
        <p class="score" id="resultScore"></p>
        <p class="band" id="resultBand"></p>
        <p class="note">估算为粗略参考（仅选择题），非正式 IELTS 分数。每题下方已显示正确答案与解析，可往下翻看。</p>
      </div>

      <main id="quiz"></main>

      <div class="actions">
        <button class="btn btn-primary" id="submitBtn" disabled>提交批改</button>
        <button class="btn btn-ghost" id="resetBtn">再来一次</button>
      </div>
    </div>

    <script>
      var PASSAGE = "Last year, the city introduced a low-emission zone covering its historic centre. Vehicles that fail to meet strict exhaust standards must pay a daily charge, while residents receive a discount and additional bus services run every ten minutes. Early data suggest the policy is working: nitrogen dioxide levels fell by 18% in six months, and bus ridership rose by 12%. Critics, however, argue that the charge falls hardest on low-income drivers who cannot afford newer cars, and that small businesses on the edge of the zone have lost customers. The council says it will review exemptions for essential workers and consider using the revenue to subsidise cleaner vehicles, rather than abandoning a scheme it calls a necessary first step.";

      var SECTIONS = [
        {
          title: "Vocabulary 词汇语境",
          questions: [
            { q: "The council plans to ______ a congestion charge in the city centre next spring.",
              opts: ["implement", "postpone", "abolish", "suspend"], ans: 0,
              why: "implement 指正式实施一项政策，符合语境。" },
            { q: "Better bus services could ______ pressure on the road network during rush hour.",
              opts: ["intensify", "alleviate", "ignore", "provoke"], ans: 1,
              why: "alleviate 意为减轻、缓解压力。" },
            { q: "Many ______ travel more than an hour each way between home and work.",
              opts: ["pedestrians", "commuters", "tourists", "residents"], ans: 1,
              why: "commuters 指每天往返于住所与工作地点之间的人。" },
            { q: "The discount is intended as an ______ for drivers to switch to public transport.",
              opts: ["incentive", "obstacle", "penalty", "exception"], ans: 0,
              why: "incentive 指鼓励某种行为的刺激、好处。" },
            { q: "Officials questioned whether building a new tram line within two years is really ______.",
              opts: ["feasible", "optional", "controversial", "temporary"], ans: 0,
              why: "feasible 意为可行的、切实可行的。" },
            { q: "The new plan will ______ pedestrians and cyclists over private cars in the city centre.",
              opts: ["prioritise", "discourage", "replace", "monitor"], ans: 0,
              why: "prioritise 意为给予优先地位。" }
          ]
        },
        {
          title: "Grammar 语法与改错",
          questions: [
            { q: "Neither the mayor nor the councillors ______ in favour of raising the charge this year.",
              opts: ["is", "are", "has been", "were being"], ans: 1,
              why: "neither…nor 就近原则，谓语与较近的主语 councillors（复数）一致，用 are。" },
            { q: "找出错误的一项：The number of cyclists have doubled since the new cycle lanes opened.",
              opts: ["The number", "have", "doubled", "opened"], ans: 1,
              why: "主语是 the number（单数），谓语应用 has 而非 have。" },
            { q: "If the city had invested in its bus network earlier, congestion ______ less severe now.",
              opts: ["would have been", "would be", "will be", "is"], ans: 1,
              why: "混合虚拟条件句，过去条件、现在结果，用 would be。" },
            { q: "The scheme, ______ aims to cut exhaust emissions, will come into force in January.",
              opts: ["that", "which", "what", "where"], ans: 1,
              why: "非限制性定语从句修饰 the scheme，关系代词用 which。" },
            { q: "Commuters are charged more ______ peak hours than at other times of day.",
              opts: ["at", "on", "in", "during"], ans: 3,
              why: "during peak hours 是固定搭配，指在高峰时段内。" },
            { q: "By 2030, the city ______ its entire bus fleet to electric vehicles.",
              opts: ["converts", "will convert", "will have converted", "has converted"], ans: 2,
              why: "by 2030 强调到将来某时已完成，用将来完成时 will have converted。" }
          ]
        },
        {
          title: "Reading 短阅读理解",
          passage: PASSAGE,
          questions: [
            { q: "According to the passage, nitrogen dioxide levels fell by ______.",
              opts: ["12%", "18%", "10%", "6%"], ans: 1,
              why: "文中明确提到 six months 内下降了 18%。" },
            { q: "Critics are mainly concerned that the charge ______.",
              opts: ["is too difficult to collect", "falls hardest on low-income drivers", "will increase bus fares", "only applies to residents"], ans: 1,
              why: "批评者认为收费对无力购买新车的低收入司机负担最重。" },
            { q: "In response to criticism, the council plans to ______.",
              opts: ["abandon the scheme", "review exemptions and consider subsidising cleaner vehicles", "raise the charge further", "close small businesses"], ans: 1,
              why: "市议会表示将审查豁免并考虑用收入补贴清洁车辆，而非放弃该计划。" },
            { q: "The rise in bus ridership most likely suggests that ______.",
              opts: ["bus fares have fallen", "more people are choosing public transport", "car ownership has risen", "the zone covers a larger area"], ans: 1,
              why: "公交乘客量上升 12% 说明更多人选择公共交通。" }
          ]
        },
        {
          title: "Usage & Meaning 用法与句意",
          questions: [
            { q: "“The low-emission zone is a double-edged sword.” 这句话的意思是该政策 ______。",
              opts: ["只会带来好处", "既有好处也有弊端", "完全失败", "难以执行"], ans: 1,
              why: "double-edged sword 比喻有好有坏的两面性。" },
            { q: "“The contractor cut corners when building the new cycle lanes.” 其中 cut corners 的意思是 ______。",
              opts: ["走了捷径、偷工减料", "增加了预算", "延长了工期", "改善了设计"], ans: 0,
              why: "cut corners 指为省时省钱而马虎行事、牺牲质量。" },
            { q: "“Bus ridership rose on the back of improved services.” 其中 on the back of 的意思是 ______。",
              opts: ["尽管", "由于、得益于", "反对", "在……之前"], ans: 1,
              why: "on the back of 表示以……为基础、由于……。" },
            { q: "“The council will take stock of the scheme after six months.” 其中 take stock of 的意思是 ______。",
              opts: ["购买", "评估、总结情况", "取消", "宣传"], ans: 1,
              why: "take stock of 指全面评估、盘点形势后再作决定。" }
          ]
        }
      ];

      var LETTERS = ["A", "B", "C", "D"];
      var TOTAL = 20;
      var selections = {}; // qid -> chosen option index
      var submitted = false;

      var quizEl = document.getElementById("quiz");
      var submitBtn = document.getElementById("submitBtn");
      var resetBtn = document.getElementById("resetBtn");
      var resultEl = document.getElementById("result");
      var progressText = document.getElementById("progressText");
      var progressBar = document.getElementById("progressBar");

      function build() {
        var n = 0;
        SECTIONS.forEach(function (sec) {
          var h = document.createElement("h2");
          h.className = "section";
          h.textContent = sec.title;
          quizEl.appendChild(h);

          if (sec.passage) {
            var p = document.createElement("div");
            p.className = "passage";
            var pp = document.createElement("p");
            pp.textContent = sec.passage;
            p.appendChild(pp);
            quizEl.appendChild(p);
          }

          sec.questions.forEach(function (item) {
            n += 1;
            var qid = "q" + n;
            var card = document.createElement("section");
            card.className = "q";
            card.id = "card-" + qid;

            var qt = document.createElement("p");
            qt.className = "q-text";
            var num = document.createElement("span");
            num.className = "q-num";
            num.textContent = "Q" + n;
            qt.appendChild(num);
            qt.appendChild(document.createTextNode(item.q));
            card.appendChild(qt);

            var opts = document.createElement("div");
            opts.className = "opts";
            item.opts.forEach(function (optText, idx) {
              var b = document.createElement("button");
              b.type = "button";
              b.className = "opt";
              b.dataset.qid = qid;
              b.dataset.idx = String(idx);
              var letter = document.createElement("span");
              letter.className = "letter";
              letter.textContent = LETTERS[idx];
              b.appendChild(letter);
              var span = document.createElement("span");
              span.textContent = optText;
              b.appendChild(span);
              b.addEventListener("click", onSelect);
              opts.appendChild(b);
            });
            card.appendChild(opts);

            var fb = document.createElement("div");
            fb.className = "feedback";
            fb.id = "fb-" + qid;
            card.appendChild(fb);

            quizEl.appendChild(card);
          });
        });
      }

      function onSelect(e) {
        if (submitted) return;
        var btn = e.currentTarget;
        var qid = btn.dataset.qid;
        selections[qid] = parseInt(btn.dataset.idx, 10);
        var siblings = document.querySelectorAll('.opt[data-qid="' + qid + '"]');
        siblings.forEach(function (b) { b.classList.remove("sel"); });
        btn.classList.add("sel");
        updateProgress();
      }

      function updateProgress() {
        var count = Object.keys(selections).length;
        progressText.textContent = "已答 " + count + " / " + TOTAL;
        progressBar.style.width = (count / TOTAL * 100) + "%";
        submitBtn.disabled = count < TOTAL;
      }

      function bandFor(score) {
        if (score >= 20) return "≈ Band 7.5+";
        if (score >= 18) return "≈ Band 7.0–7.5";
        if (score >= 16) return "≈ Band 6.5–7.0";
        if (score >= 14) return "≈ Band 6.0–6.5";
        if (score >= 12) return "≈ Band 5.5–6.0";
        return "Band 5.5 以下";
      }

      function questionById(qid) {
        var n = parseInt(qid.slice(1), 10);
        var i = 0;
        for (var s = 0; s < SECTIONS.length; s++) {
          for (var k = 0; k < SECTIONS[s].questions.length; k++) {
            i += 1;
            if (i === n) return SECTIONS[s].questions[k];
          }
        }
        return null;
      }

      function submit() {
        if (Object.keys(selections).length < TOTAL) return;
        submitted = true;
        var score = 0;
        for (var n = 1; n <= TOTAL; n++) {
          var qid = "q" + n;
          var item = questionById(qid);
          var chosen = selections[qid];
          var correct = chosen === item.ans;
          if (correct) score += 1;

          var btns = document.querySelectorAll('.opt[data-qid="' + qid + '"]');
          btns.forEach(function (b) {
            b.disabled = true;
            var idx = parseInt(b.dataset.idx, 10);
            if (idx === item.ans) b.classList.add("is-correct");
            else if (idx === chosen) b.classList.add("is-wrong");
          });

          var fb = document.getElementById("fb-" + qid);
          fb.innerHTML = "";
          var v = document.createElement("span");
          v.className = "verdict " + (correct ? "ok" : "no");
          v.textContent = correct
            ? "✓ 回答正确"
            : "✗ 回答错误，正确答案是 " + LETTERS[item.ans];
          fb.appendChild(v);
          var why = document.createElement("span");
          why.className = "why";
          why.textContent = item.why;
          fb.appendChild(why);
          fb.classList.add("show");
        }

        document.getElementById("resultScore").textContent = score + " / " + TOTAL;
        document.getElementById("resultBand").textContent = "IELTS 估算：" + bandFor(score);
        resultEl.classList.add("show");
        submitBtn.disabled = true;
        resultEl.scrollIntoView({ behavior: "smooth", block: "start" });
      }

      function reset() {
        submitted = false;
        selections = {};
        document.querySelectorAll(".opt").forEach(function (b) {
          b.classList.remove("sel", "is-correct", "is-wrong");
          b.disabled = false;
        });
        document.querySelectorAll(".feedback").forEach(function (f) {
          f.classList.remove("show");
          f.innerHTML = "";
        });
        resultEl.classList.remove("show");
        updateProgress();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      build();
      updateProgress();
      submitBtn.addEventListener("click", submit);
      resetBtn.addEventListener("click", reset);
    </script>
  </body>
</html>
