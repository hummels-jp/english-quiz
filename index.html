<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>Daily English Quiz</title>
    <style>
      :root {
        --bg: #f7f8f6;
        --surface: #ffffff;
        --ink: #1c2420;
        --muted: #5b6660;
        --line: #dde2dc;
        --accent: #0f766e;
        --accent-ink: #0b5a54;
        --accent-soft: #e3f2ef;
        --correct: #15803d;
        --correct-soft: #e6f4ea;
        --wrong: #b91c1c;
        --wrong-soft: #fbe9e9;
        --shadow: 0 1px 3px rgba(20, 30, 25, 0.07);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #121614;
          --surface: #1b201d;
          --ink: #e8ede9;
          --muted: #9aa79e;
          --line: #313832;
          --accent: #2dd4bf;
          --accent-ink: #5eead4;
          --accent-soft: #12302c;
          --correct: #4ade80;
          --correct-soft: #12291a;
          --wrong: #f87171;
          --wrong-soft: #331818;
          --shadow: 0 1px 3px rgba(0, 0, 0, 0.4);
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans", "Noto Sans SC", "Microsoft YaHei", sans-serif;
        line-height: 1.55;
        -webkit-tap-highlight-color: transparent;
      }
      .wrap {
        max-width: 680px;
        margin: 0 auto;
        padding: 20px 16px 48px;
      }
      header { margin-bottom: 18px; }
      h1 {
        font-size: 22px;
        margin: 0 0 6px;
        letter-spacing: 0.2px;
      }
      .instr {
        color: var(--muted);
        font-size: 14px;
        margin: 0;
      }
      .progress {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 14px 0 4px;
        font-size: 14px;
        color: var(--muted);
      }
      .progress .bar {
        flex: 1;
        height: 6px;
        border-radius: 3px;
        background: var(--line);
        overflow: hidden;
      }
      .progress .bar i {
        display: block;
        height: 100%;
        width: 0%;
        background: var(--accent);
        transition: width 0.25s ease;
      }
      h2.section {
        font-size: 16px;
        margin: 26px 0 10px;
        padding-bottom: 6px;
        border-bottom: 2px solid var(--accent);
        color: var(--accent-ink);
      }
      .passage {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 14px 16px;
        font-size: 15px;
        line-height: 1.7;
        box-shadow: var(--shadow);
        margin-bottom: 12px;
      }
      .passage p { margin: 0; }
      .q {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 16px;
        margin-bottom: 12px;
        box-shadow: var(--shadow);
      }
      .q-text {
        font-size: 16px;
        margin: 0 0 12px;
        font-weight: 500;
      }
      .q-num {
        display: inline-block;
        font-size: 12px;
        font-weight: 700;
        color: var(--accent-ink);
        background: var(--accent-soft);
        border-radius: 4px;
        padding: 2px 7px;
        margin-right: 8px;
        vertical-align: 2px;
      }
      .opts { display: grid; gap: 8px; }
      .opt {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        width: 100%;
        text-align: left;
        font: inherit;
        font-size: 15px;
        color: var(--ink);
        background: var(--bg);
        border: 1.5px solid var(--line);
        border-radius: 8px;
        padding: 13px 14px;
        min-height: 52px;
        cursor: pointer;
        transition: border-color 0.15s ease, background 0.15s ease;
      }
      .opt .letter {
        flex: none;
        width: 24px;
        height: 24px;
        border-radius: 50%;
        border: 1.5px solid var(--line);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 13px;
        font-weight: 700;
        color: var(--muted);
        margin-top: 1px;
      }
      .opt.sel {
        border-color: var(--accent);
        background: var(--accent-soft);
      }
      .opt.sel .letter {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      @media (prefers-color-scheme: dark) {
        .opt.sel .letter { color: #0b201d; }
      }
      .opt:disabled { cursor: default; opacity: 1; }
      .opt.is-correct {
        border-color: var(--correct);
        background: var(--correct-soft);
      }
      .opt.is-correct .letter {
        background: var(--correct);
        border-color: var(--correct);
        color: #fff;
      }
      .opt.is-wrong {
        border-color: var(--wrong);
        background: var(--wrong-soft);
      }
      .opt.is-wrong .letter {
        background: var(--wrong);
        border-color: var(--wrong);
        color: #fff;
      }
      .feedback {
        display: none;
        margin-top: 12px;
        font-size: 14px;
        line-height: 1.6;
        border-top: 1px dashed var(--line);
        padding-top: 10px;
      }
      .feedback.show { display: block; }
      .feedback .verdict { font-weight: 700; }
      .feedback .verdict.ok { color: var(--correct); }
      .feedback .verdict.no { color: var(--wrong); }
      .feedback .why { color: var(--muted); display: block; margin-top: 2px; }
      .actions {
        display: flex;
        gap: 10px;
        margin-top: 22px;
      }
      .btn {
        flex: 1;
        font: inherit;
        font-size: 16px;
        font-weight: 600;
        border-radius: 10px;
        padding: 14px;
        cursor: pointer;
        border: none;
      }
      .btn-primary { background: var(--accent); color: #fff; }
      @media (prefers-color-scheme: dark) {
        .btn-primary { color: #0b201d; }
      }
      .btn-primary:disabled { opacity: 0.45; cursor: not-allowed; }
      .btn-ghost {
        background: var(--surface);
        color: var(--ink);
        border: 1.5px solid var(--line);
        flex: 0 0 auto;
        padding: 14px 20px;
      }
      .result {
        display: none;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 18px;
        margin-bottom: 18px;
        box-shadow: var(--shadow);
        text-align: center;
      }
      .result.show { display: block; }
      .result .score {
        font-size: 34px;
        font-weight: 800;
        margin: 0;
      }
      .result .band {
        font-size: 17px;
        font-weight: 700;
        color: var(--accent-ink);
        margin: 6px 0 2px;
      }
      .result .note {
        font-size: 13px;
        color: var(--muted);
        margin: 2px 0 0;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <h1>Daily English Quiz · Day 4 · 2026-10-27</h1>
        <p class="instr">点选每题答案，每题只能选一个；全部选完后点「提交批改」。建议限时 15 分钟，不查词典。</p>
        <div class="progress">
          <span id="progressText">已答 0 / 20</span>
          <span class="bar"><i id="progressBar"></i></span>
        </div>
      </header>

      <div class="result" id="result">
        <p class="score" id="resultScore"></p>
        <p class="band" id="resultBand"></p>
        <p class="note">估算为粗略参考（仅选择题），非正式 IELTS 分数。每题下方已显示正确答案与解析，可往下翻看。</p>
      </div>

      <main id="quiz"></main>

      <div class="actions">
        <button class="btn btn-primary" id="submitBtn" disabled>提交批改</button>
        <button class="btn btn-ghost" id="resetBtn">再来一次</button>
      </div>
    </div>

    <script>
      var PASSAGE = "The '15-minute city' is an urban planning idea in which everything residents need daily — work, schools, shops, clinics and parks — lies within a 15-minute walk or cycle from home. Supporters say it cuts car use, lowers emissions and gives people back time now lost in traffic. Critics, however, warn that the model works best in dense inner-city districts and is hard to apply to sprawling suburbs, where homes, jobs and services are far apart. They also fear that restricting car access could inconvenience elderly or disabled residents who depend on driving. Advocates reply that the goal is not to ban cars but to make walking, cycling and public transport so convenient that driving becomes a choice rather than a necessity.";

      var SECTIONS = [
        {
          title: "Vocabulary 词汇语境",
          questions: [
            { q: "The city council's plan to introduce congestion charges has sparked fierce debate: supporters argue it will ___ traffic in the centre, while critics warn it may hurt small businesses.",
              opts: ["alleviate", "accumulate", "accelerate", "anticipate"], ans: 0,
              why: "alleviate 意为“缓解”，符合减少市中心交通的语境。" },
            { q: "Many commuters have ___ cycling as their main way to get to work since the new bike lanes opened.",
              opts: ["adopted", "adapted", "adjusted", "admitted"], ans: 0,
              why: "adopt 意为“采用、采纳”；adapt 是“使适应”，不合语境。" },
            { q: "The mayor promised that the new tram line would be completed on schedule, but critics remain ___ about whether the funding is sufficient.",
              opts: ["sceptical", "indifferent", "optimistic", "enthusiastic"], ans: 0,
              why: "sceptical 表示怀疑，与 but 的转折一致。" },
            { q: "To ___ the pressure on the overloaded metro system, planners are encouraging staggered working hours.",
              opts: ["ease", "erase", "evade", "exhaust"], ans: 0,
              why: "ease pressure 是固定搭配，意为“缓解压力”。" },
            { q: "The report highlights a stark ___ between neighbourhoods with good public transport and those without: residents in the latter spend twice as long commuting.",
              opts: ["contrast", "conflict", "contest", "contact"], ans: 0,
              why: "contrast 指对比、差异，stark contrast 为固定搭配。" },
            { q: "City officials hope the new green corridors will ___ residents to walk more and rely less on cars.",
              opts: ["compel", "entice", "oblige", "enforce"], ans: 1,
              why: "entice 意为“吸引、诱使”，语气积极；其余三项均含强制意味，不合语境。" }
          ]
        },
        {
          title: "Grammar 语法与改错",
          questions: [
            { q: "Which sentence contains a grammatical error?",
              opts: ["Each of the new bus routes have been redesigned to serve the suburbs.", "The number of cyclists on the new lane has doubled since January.", "Neither the mayor nor the councillors were present at the hearing.", "Walking to work every day keeps her fit and saves money."], ans: 0,
              why: "Each of + 复数名词后谓语用单数，应为 has been redesigned。" },
            { q: "Which sentence is grammatically correct?",
              opts: ["If the city invests more in trams, traffic congestion would reduce significantly.", "If the city invested more in trams, traffic congestion would reduce significantly.", "If the city would invest more in trams, traffic congestion will reduce significantly.", "If the city had invested more in trams, traffic congestion will reduce significantly."], ans: 1,
              why: "与现在事实相反的假设用过去时 + would。" },
            { q: "Which part contains an error? “Not only the residents (A) but also the local businesses (B) opposes (C) the road closure (D).”",
              opts: ["A", "B", "C", "D"], ans: 2,
              why: "not only...but also 遵循就近原则，谓语应与 businesses 一致，用 oppose。" },
            { q: "Which sentence is grammatically correct?",
              opts: ["The number of people using public transport are increasing every year.", "A number of new stations is being built along the line.", "The number of people using public transport is increasing every year.", "A number of new stations has been built along the line."], ans: 2,
              why: "the number of 作主语谓语用单数；a number of 后谓语用复数。" },
            { q: "Which part contains an error? “She suggested (A) that he takes (B) the night bus instead of driving (C) home after the late meeting (D).”",
              opts: ["A", "B", "C", "D"], ans: 1,
              why: "suggest 后 that 从句用虚拟语气，动词用原形 take。" },
            { q: "Which sentence contains a grammatical error?",
              opts: ["Having finished the report, the data was submitted to the council.", "Having finished the report, she submitted the data to the council.", "The data, having been checked twice, was submitted to the council.", "After checking the data twice, she submitted it to the council."], ans: 0,
              why: "分词逻辑主语不一致，完成报告的应是人而非 data，属悬垂修饰。" }
          ]
        },
        {
          title: "Reading 短阅读理解",
          passage: PASSAGE,
          questions: [
            { q: "What is the main idea of the passage?",
              opts: ["Cities should ban cars entirely.", "Daily necessities should be reachable within a short walk or cycle.", "Suburbs are better places to live than city centres.", "Public transport is the only solution to traffic."], ans: 1,
              why: "短文核心即“15 分钟城市”概念：日常所需皆在步行或骑行 15 分钟内。" },
            { q: "According to critics, the model's main limitation is that ____.",
              opts: ["it increases emissions", "it is difficult to apply in low-density suburbs", "it gives people too much free time", "it bans cars completely"], ans: 1,
              why: "批评者指出该模式在低密度、蔓延式郊区难以推行。" },
            { q: "The word “sprawling” in the passage is closest in meaning to ____.",
              opts: ["crowded", "expanding over a large area", "wealthy", "modern"], ans: 1,
              why: "sprawling 指（城市）无规划地向外大面积蔓延。" },
            { q: "What do advocates say is the real goal?",
              opts: ["To ban all private cars.", "To make alternatives so convenient that driving becomes optional.", "To build more roads.", "To move everyone into city centres."], ans: 1,
              why: "倡导者称目标不是禁车，而是让步行、骑行和公交足够便利，使开车成为可选项而非必需。" }
          ]
        },
        {
          title: "Usage & Meaning 用法与句意",
          questions: [
            { q: "“The plan is still on the drawing board” means ____.",
              opts: ["It has been approved.", "It is still being designed or planned.", "It has been cancelled.", "It is under construction."], ans: 1,
              why: "on the drawing board 意为“尚在筹划、设计阶段”。" },
            { q: "Choose the best paraphrase of “The council had no choice but to raise fares.”",
              opts: ["The council wanted to raise fares.", "The council was forced to raise fares.", "The council refused to raise fares.", "The council decided not to raise fares."], ans: 1,
              why: "had no choice but to 即“不得不”，表示被迫。" },
            { q: "In “The new metro line will be a game changer for the suburbs”, “game changer” means ____.",
              opts: ["something that significantly changes a situation", "a new sports facility", "a rule change", "an entertainment venue"], ans: 0,
              why: "game changer 指能显著改变局面的事物。" },
            { q: "Which sentence best expresses polite disagreement in a workplace meeting?",
              opts: ["“That's completely wrong.”", "“I see your point, but I wonder whether a different approach might work better.”", "“You don't understand the problem.”", "“Let's just do it my way.”"], ans: 1,
              why: "先肯定对方再委婉提出不同看法，是职场礼貌表达异议的方式。" }
          ]
        }
      ];

      var LETTERS = ["A", "B", "C", "D"];
      var TOTAL = 20;
      var selections = {}; // qid -> chosen option index
      var submitted = false;

      var quizEl = document.getElementById("quiz");
      var submitBtn = document.getElementById("submitBtn");
      var resetBtn = document.getElementById("resetBtn");
      var resultEl = document.getElementById("result");
      var progressText = document.getElementById("progressText");
      var progressBar = document.getElementById("progressBar");

      function build() {
        var n = 0;
        SECTIONS.forEach(function (sec) {
          var h = document.createElement("h2");
          h.className = "section";
          h.textContent = sec.title;
          quizEl.appendChild(h);

          if (sec.passage) {
            var p = document.createElement("div");
            p.className = "passage";
            var pp = document.createElement("p");
            pp.textContent = sec.passage;
            p.appendChild(pp);
            quizEl.appendChild(p);
          }

          sec.questions.forEach(function (item) {
            n += 1;
            var qid = "q" + n;
            var card = document.createElement("section");
            card.className = "q";
            card.id = "card-" + qid;

            var qt = document.createElement("p");
            qt.className = "q-text";
            var num = document.createElement("span");
            num.className = "q-num";
            num.textContent = "Q" + n;
            qt.appendChild(num);
            qt.appendChild(document.createTextNode(item.q));
            card.appendChild(qt);

            var opts = document.createElement("div");
            opts.className = "opts";
            item.opts.forEach(function (optText, idx) {
              var b = document.createElement("button");
              b.type = "button";
              b.className = "opt";
              b.dataset.qid = qid;
              b.dataset.idx = String(idx);
              var letter = document.createElement("span");
              letter.className = "letter";
              letter.textContent = LETTERS[idx];
              b.appendChild(letter);
              var span = document.createElement("span");
              span.textContent = optText;
              b.appendChild(span);
              b.addEventListener("click", onSelect);
              opts.appendChild(b);
            });
            card.appendChild(opts);

            var fb = document.createElement("div");
            fb.className = "feedback";
            fb.id = "fb-" + qid;
            card.appendChild(fb);

            quizEl.appendChild(card);
          });
        });
      }

      function onSelect(e) {
        if (submitted) return;
        var btn = e.currentTarget;
        var qid = btn.dataset.qid;
        selections[qid] = parseInt(btn.dataset.idx, 10);
        var siblings = document.querySelectorAll('.opt[data-qid="' + qid + '"]');
        siblings.forEach(function (b) { b.classList.remove("sel"); });
        btn.classList.add("sel");
        updateProgress();
      }

      function updateProgress() {
        var count = Object.keys(selections).length;
        progressText.textContent = "已答 " + count + " / " + TOTAL;
        progressBar.style.width = (count / TOTAL * 100) + "%";
        submitBtn.disabled = count < TOTAL;
      }

      function bandFor(score) {
        if (score >= 20) return "≈ Band 7.5+";
        if (score >= 18) return "≈ Band 7.0–7.5";
        if (score >= 16) return "≈ Band 6.5–7.0";
        if (score >= 14) return "≈ Band 6.0–6.5";
        if (score >= 12) return "≈ Band 5.5–6.0";
        return "Band 5.5 以下";
      }

      function questionById(qid) {
        var n = parseInt(qid.slice(1), 10);
        var i = 0;
        for (var s = 0; s < SECTIONS.length; s++) {
          for (var k = 0; k < SECTIONS[s].questions.length; k++) {
            i += 1;
            if (i === n) return SECTIONS[s].questions[k];
          }
        }
        return null;
      }

      function submit() {
        if (Object.keys(selections).length < TOTAL) return;
        submitted = true;
        var score = 0;
        for (var n = 1; n <= TOTAL; n++) {
          var qid = "q" + n;
          var item = questionById(qid);
          var chosen = selections[qid];
          var correct = chosen === item.ans;
          if (correct) score += 1;

          var btns = document.querySelectorAll('.opt[data-qid="' + qid + '"]');
          btns.forEach(function (b) {
            b.disabled = true;
            var idx = parseInt(b.dataset.idx, 10);
            if (idx === item.ans) b.classList.add("is-correct");
            else if (idx === chosen) b.classList.add("is-wrong");
          });

          var fb = document.getElementById("fb-" + qid);
          fb.innerHTML = "";
          var v = document.createElement("span");
          v.className = "verdict " + (correct ? "ok" : "no");
          v.textContent = correct
            ? "✓ 回答正确"
            : "✗ 回答错误，正确答案是 " + LETTERS[item.ans];
          fb.appendChild(v);
          var why = document.createElement("span");
          why.className = "why";
          why.textContent = item.why;
          fb.appendChild(why);
          fb.classList.add("show");
        }

        document.getElementById("resultScore").textContent = score + " / " + TOTAL;
        document.getElementById("resultBand").textContent = "IELTS 估算：" + bandFor(score);
        resultEl.classList.add("show");
        submitBtn.disabled = true;
        resultEl.scrollIntoView({ behavior: "smooth", block: "start" });
      }

      function reset() {
        submitted = false;
        selections = {};
        document.querySelectorAll(".opt").forEach(function (b) {
          b.classList.remove("sel", "is-correct", "is-wrong");
          b.disabled = false;
        });
        document.querySelectorAll(".feedback").forEach(function (f) {
          f.classList.remove("show");
          f.innerHTML = "";
        });
        resultEl.classList.remove("show");
        updateProgress();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      build();
      updateProgress();
      submitBtn.addEventListener("click", submit);
      resetBtn.addEventListener("click", reset);
    </script>
  </body>
</html>
