<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>Daily English Quiz</title>
    <style>
      :root {
        --bg: #f7f8f6;
        --surface: #ffffff;
        --ink: #1c2420;
        --muted: #5b6660;
        --line: #dde2dc;
        --accent: #0f766e;
        --accent-ink: #0b5a54;
        --accent-soft: #e3f2ef;
        --correct: #15803d;
        --correct-soft: #e6f4ea;
        --wrong: #b91c1c;
        --wrong-soft: #fbe9e9;
        --shadow: 0 1px 3px rgba(20, 30, 25, 0.07);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #121614;
          --surface: #1b201d;
          --ink: #e8ede9;
          --muted: #9aa79e;
          --line: #313832;
          --accent: #2dd4bf;
          --accent-ink: #5eead4;
          --accent-soft: #12302c;
          --correct: #4ade80;
          --correct-soft: #12291a;
          --wrong: #f87171;
          --wrong-soft: #331818;
          --shadow: 0 1px 3px rgba(0, 0, 0, 0.4);
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans", "Noto Sans SC", "Microsoft YaHei", sans-serif;
        line-height: 1.55;
        -webkit-tap-highlight-color: transparent;
      }
      .wrap {
        max-width: 680px;
        margin: 0 auto;
        padding: 20px 16px 48px;
      }
      header { margin-bottom: 18px; }
      h1 {
        font-size: 22px;
        margin: 0 0 6px;
        letter-spacing: 0.2px;
      }
      .instr {
        color: var(--muted);
        font-size: 14px;
        margin: 0;
      }
      .progress {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 14px 0 4px;
        font-size: 14px;
        color: var(--muted);
      }
      .progress .bar {
        flex: 1;
        height: 6px;
        border-radius: 3px;
        background: var(--line);
        overflow: hidden;
      }
      .progress .bar i {
        display: block;
        height: 100%;
        width: 0%;
        background: var(--accent);
        transition: width 0.25s ease;
      }
      h2.section {
        font-size: 16px;
        margin: 26px 0 10px;
        padding-bottom: 6px;
        border-bottom: 2px solid var(--accent);
        color: var(--accent-ink);
      }
      .passage {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 14px 16px;
        font-size: 15px;
        line-height: 1.7;
        box-shadow: var(--shadow);
        margin-bottom: 12px;
      }
      .passage p { margin: 0; }
      .q {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 16px;
        margin-bottom: 12px;
        box-shadow: var(--shadow);
      }
      .q-text {
        font-size: 16px;
        margin: 0 0 12px;
        font-weight: 500;
      }
      .q-num {
        display: inline-block;
        font-size: 12px;
        font-weight: 700;
        color: var(--accent-ink);
        background: var(--accent-soft);
        border-radius: 4px;
        padding: 2px 7px;
        margin-right: 8px;
        vertical-align: 2px;
      }
      .opts { display: grid; gap: 8px; }
      .opt {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        width: 100%;
        text-align: left;
        font: inherit;
        font-size: 15px;
        color: var(--ink);
        background: var(--bg);
        border: 1.5px solid var(--line);
        border-radius: 8px;
        padding: 13px 14px;
        min-height: 52px;
        cursor: pointer;
        transition: border-color 0.15s ease, background 0.15s ease;
      }
      .opt .letter {
        flex: none;
        width: 24px;
        height: 24px;
        border-radius: 50%;
        border: 1.5px solid var(--line);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 13px;
        font-weight: 700;
        color: var(--muted);
        margin-top: 1px;
      }
      .opt.sel {
        border-color: var(--accent);
        background: var(--accent-soft);
      }
      .opt.sel .letter {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      @media (prefers-color-scheme: dark) {
        .opt.sel .letter { color: #0b201d; }
      }
      .opt:disabled { cursor: default; opacity: 1; }
      .opt.is-correct {
        border-color: var(--correct);
        background: var(--correct-soft);
      }
      .opt.is-correct .letter {
        background: var(--correct);
        border-color: var(--correct);
        color: #fff;
      }
      .opt.is-wrong {
        border-color: var(--wrong);
        background: var(--wrong-soft);
      }
      .opt.is-wrong .letter {
        background: var(--wrong);
        border-color: var(--wrong);
        color: #fff;
      }
      .feedback {
        display: none;
        margin-top: 12px;
        font-size: 14px;
        line-height: 1.6;
        border-top: 1px dashed var(--line);
        padding-top: 10px;
      }
      .feedback.show { display: block; }
      .feedback .verdict { font-weight: 700; }
      .feedback .verdict.ok { color: var(--correct); }
      .feedback .verdict.no { color: var(--wrong); }
      .feedback .why { color: var(--muted); display: block; margin-top: 2px; }
      .actions {
        display: flex;
        gap: 10px;
        margin-top: 22px;
      }
      .btn {
        flex: 1;
        font: inherit;
        font-size: 16px;
        font-weight: 600;
        border-radius: 10px;
        padding: 14px;
        cursor: pointer;
        border: none;
      }
      .btn-primary { background: var(--accent); color: #fff; }
      @media (prefers-color-scheme: dark) {
        .btn-primary { color: #0b201d; }
      }
      .btn-primary:disabled { opacity: 0.45; cursor: not-allowed; }
      .btn-ghost {
        background: var(--surface);
        color: var(--ink);
        border: 1.5px solid var(--line);
        flex: 0 0 auto;
        padding: 14px 20px;
      }
      .result {
        display: none;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 18px;
        margin-bottom: 18px;
        box-shadow: var(--shadow);
        text-align: center;
      }
      .result.show { display: block; }
      .result .score {
        font-size: 34px;
        font-weight: 800;
        margin: 0;
      }
      .result .band {
        font-size: 17px;
        font-weight: 700;
        color: var(--accent-ink);
        margin: 6px 0 2px;
      }
      .result .note {
        font-size: 13px;
        color: var(--muted);
        margin: 2px 0 0;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <h1>Daily English Quiz · Day 2 · 2026-10-25</h1>
        <p class="instr">点选每题答案，每题只能选一个；全部选完后点「提交批改」。建议限时 15 分钟，不查词典。</p>
        <div class="progress">
          <span id="progressText">已答 0 / 20</span>
          <span class="bar"><i id="progressBar"></i></span>
        </div>
      </header>

      <div class="result" id="result">
        <p class="score" id="resultScore"></p>
        <p class="band" id="resultBand"></p>
        <p class="note">估算为粗略参考（仅选择题），非正式 IELTS 分数。每题下方已显示正确答案与解析，可往下翻看。</p>
      </div>

      <main id="quiz"></main>

      <div class="actions">
        <button class="btn btn-primary" id="submitBtn" disabled>提交批改</button>
        <button class="btn btn-ghost" id="resetBtn">再来一次</button>
      </div>
    </div>

    <script>
      var PASSAGE = "High-definition maps give self-driving vehicles centimetre-level detail about lane markings, road edges, and traffic signs. Unlike a standard navigation map, an HD map must reflect the road exactly as it is today, not as it was months ago. Roadworks, new signs, and repainted lanes can quickly make a map stale. To keep maps current, companies combine survey vehicles with data from fleets on the road, updating sections as changes are detected. However, engineers warn against relying on the map alone: sensors must still confirm what is actually ahead, because no map can predict a fallen tree or a temporary barrier. The safest systems therefore treat the map as a strong prior belief, not as absolute truth.";

      var SECTIONS = [
        {
          title: "Vocabulary 词汇",
          questions: [
            { q: "To reduce the risk of a system failure, the team took early steps to ______ the impact of sensor errors.",
              opts: ["mitigate", "magnify", "ignore", "postpone"], ans: 0,
              why: "Mitigate means to make a problem less severe." },
            { q: "The client's instructions were so ______ that two teams interpreted them in completely different ways.",
              opts: ["precise", "ambiguous", "urgent", "generous"], ans: 1,
              why: "Ambiguous means open to more than one interpretation." },
            { q: "Before release, the software must pass ______ testing under rain, snow, and low-light conditions.",
              opts: ["fragile", "casual", "robust", "optional"], ans: 2,
              why: "Robust testing means thorough and able to handle difficult conditions." },
            { q: "Rather than launching a perfect product at once, the team follows an ______ process, improving the map in repeated cycles.",
              opts: ["iterative", "instant", "random", "final"], ans: 0,
              why: "Iterative means done in repeated cycles of improvement." },
            { q: "Engineers noticed a ______ between the HD map and the vehicle's live sensor readings at the intersection.",
              opts: ["similarity", "discrepancy", "agreement", "routine"], ans: 1,
              why: "A discrepancy is a difference between two things that should match." },
            { q: "After a long discussion, all stakeholders finally ______ on the launch timeline.",
              opts: ["disagreed", "aligned", "hesitated", "competed"], ans: 1,
              why: "To align on something means to reach agreement about it." }
          ]
        },
        {
          title: "Grammar 语法",
          questions: [
            { q: "Choose the correct sentence:",
              opts: [
                "Each of the engineers have reviewed the test report.",
                "Each of the engineers has reviewed the test report.",
                "Each of the engineers are reviewing the test report.",
                "Each of the engineers have review the test report."
              ], ans: 1,
              why: "“Each” takes a singular verb, so “has” is correct." },
            { q: "Choose the correct sentence:",
              opts: [
                "Not only the team improved accuracy, but also reduced latency.",
                "Not only did the team improve accuracy, but it also reduced latency.",
                "Not only did the team improved accuracy, but also it reduced latency.",
                "Not only the team did improve accuracy, but it also reduced latency."
              ], ans: 1,
              why: "After “not only” at the start, the verb and subject invert (“did the team improve”)." },
            { q: "Choose the correct sentence:",
              opts: [
                "If the sensor failed yesterday, the vehicle would stop safely.",
                "If the sensor had failed yesterday, the vehicle would have stopped safely.",
                "If the sensor had failed yesterday, the vehicle would stop safely.",
                "If the sensor fails yesterday, the vehicle would have stopped safely."
              ], ans: 1,
              why: "A past unreal condition uses “had + past participle” with “would have + past participle”." },
            { q: "Choose the correct sentence:",
              opts: [
                "Neither the manager nor the engineers was available for the review.",
                "Neither the manager nor the engineers were available for the review.",
                "Neither the manager nor the engineers is available for the review.",
                "Neither the manager or the engineers were available for the review."
              ], ans: 1,
              why: "With “neither…nor”, the verb agrees with the nearer subject, “engineers”." },
            { q: "Choose the correct sentence:",
              opts: [
                "Having validated the new map data, the team deployed the update.",
                "Having validate the new map data, the team deployed the update.",
                "Having validated the new map data, the update was deployed by the team yesterday morning it.",
                "Validated the new map data, the team deployed the update it."
              ], ans: 0,
              why: "“Having validated” correctly shows a completed action before the main action." },
            { q: "Choose the correct sentence:",
              opts: [
                "The project lead is responsible to ensuring data quality.",
                "The project lead is responsible for ensuring data quality.",
                "The project lead is responsible of ensuring data quality.",
                "The project lead is responsible in ensuring data quality."
              ], ans: 1,
              why: "The fixed collocation is “responsible for” + gerund." }
          ]
        },
        {
          title: "Reading 阅读",
          passage: PASSAGE,
          questions: [
            { q: "What is the main purpose of an HD map, according to the passage?",
              opts: ["To replace all vehicle sensors.", "To give very precise detail about the road environment.", "To predict temporary obstacles.", "To reduce the cost of survey vehicles."], ans: 1,
              why: "The passage says HD maps give centimetre-level detail about lanes, edges, and signs." },
            { q: "Why must HD maps be updated frequently?",
              opts: ["Because drivers prefer new maps.", "Because roadworks and new signs quickly make them out of date.", "Because survey vehicles are expensive.", "Because sensors cannot work without them."], ans: 1,
              why: "Roadworks, new signs, and repainted lanes can quickly make a map stale." },
            { q: "What does the word “stale” mean in this passage?",
              opts: ["Very detailed.", "Expensive to produce.", "No longer accurate or fresh.", "Widely used."], ans: 2,
              why: "“Stale” here means outdated and no longer matching reality." },
            { q: "What can be inferred about the safest self-driving systems?",
              opts: ["They ignore sensor data.", "They treat the map as one source of information to be checked against sensors.", "They never use HD maps.", "They can predict all temporary obstacles."], ans: 1,
              why: "The safest systems treat the map as a prior belief, not absolute truth, and still check with sensors." }
          ]
        },
        {
          title: "Usage & Meaning 用法与句意",
          questions: [
            { q: "“We cannot cut corners on safety testing, even under deadline pressure.” The phrase “cut corners” means:",
              opts: ["To save time by skipping important steps.", "To design a sharper product.", "To reduce the budget fairly.", "To divide work equally."], ans: 0,
              why: "To cut corners means to do something cheaply or quickly by skipping proper steps." },
            { q: "“Before the client meeting, let's make sure we are all on the same page.” This means:",
              opts: ["We should read the same document.", "We should share the same understanding.", "We should sit together.", "We should finish at the same time."], ans: 1,
              why: "“On the same page” means sharing the same understanding or agreement." },
            { q: "“The company will roll out the update region by region.” “Roll out” means:",
              opts: ["To withdraw a product.", "To introduce or launch something gradually.", "To test in secret.", "To cancel a plan."], ans: 1,
              why: "To roll out means to introduce a product or update in stages." },
            { q: "“There is a trade-off between response speed and accuracy.” A “trade-off” is:",
              opts: ["A complete solution.", "A situation where improving one thing worsens another.", "A legal agreement.", "A free exchange of goods."], ans: 1,
              why: "A trade-off means gaining one benefit at the cost of another." }
          ]
        }
      ];

      var LETTERS = ["A", "B", "C", "D"];
      var TOTAL = 20;
      var selections = {}; // qid -> chosen option index
      var submitted = false;

      var quizEl = document.getElementById("quiz");
      var submitBtn = document.getElementById("submitBtn");
      var resetBtn = document.getElementById("resetBtn");
      var resultEl = document.getElementById("result");
      var progressText = document.getElementById("progressText");
      var progressBar = document.getElementById("progressBar");

      function build() {
        var n = 0;
        SECTIONS.forEach(function (sec) {
          var h = document.createElement("h2");
          h.className = "section";
          h.textContent = sec.title;
          quizEl.appendChild(h);

          if (sec.passage) {
            var p = document.createElement("div");
            p.className = "passage";
            var pp = document.createElement("p");
            pp.textContent = sec.passage;
            p.appendChild(pp);
            quizEl.appendChild(p);
          }

          sec.questions.forEach(function (item) {
            n += 1;
            var qid = "q" + n;
            var card = document.createElement("section");
            card.className = "q";
            card.id = "card-" + qid;

            var qt = document.createElement("p");
            qt.className = "q-text";
            var num = document.createElement("span");
            num.className = "q-num";
            num.textContent = "Q" + n;
            qt.appendChild(num);
            qt.appendChild(document.createTextNode(item.q));
            card.appendChild(qt);

            var opts = document.createElement("div");
            opts.className = "opts";
            item.opts.forEach(function (optText, idx) {
              var b = document.createElement("button");
              b.type = "button";
              b.className = "opt";
              b.dataset.qid = qid;
              b.dataset.idx = String(idx);
              var letter = document.createElement("span");
              letter.className = "letter";
              letter.textContent = LETTERS[idx];
              b.appendChild(letter);
              var span = document.createElement("span");
              span.textContent = optText;
              b.appendChild(span);
              b.addEventListener("click", onSelect);
              opts.appendChild(b);
            });
            card.appendChild(opts);

            var fb = document.createElement("div");
            fb.className = "feedback";
            fb.id = "fb-" + qid;
            card.appendChild(fb);

            quizEl.appendChild(card);
          });
        });
      }

      function onSelect(e) {
        if (submitted) return;
        var btn = e.currentTarget;
        var qid = btn.dataset.qid;
        selections[qid] = parseInt(btn.dataset.idx, 10);
        var siblings = document.querySelectorAll('.opt[data-qid="' + qid + '"]');
        siblings.forEach(function (b) { b.classList.remove("sel"); });
        btn.classList.add("sel");
        updateProgress();
      }

      function updateProgress() {
        var count = Object.keys(selections).length;
        progressText.textContent = "已答 " + count + " / " + TOTAL;
        progressBar.style.width = (count / TOTAL * 100) + "%";
        submitBtn.disabled = count < TOTAL;
      }

      function bandFor(score) {
        if (score >= 18) return "≈ Band 7.5+";
        if (score >= 15) return "≈ Band 7.0";
        if (score >= 12) return "≈ Band 6.5";
        if (score >= 9) return "≈ Band 6.0";
        return "≈ Band 6.0 以下";
      }

      function questionById(qid) {
        var n = parseInt(qid.slice(1), 10);
        var i = 0;
        for (var s = 0; s < SECTIONS.length; s++) {
          for (var k = 0; k < SECTIONS[s].questions.length; k++) {
            i += 1;
            if (i === n) return SECTIONS[s].questions[k];
          }
        }
        return null;
      }

      function submit() {
        if (Object.keys(selections).length < TOTAL) return;
        submitted = true;
        var score = 0;
        for (var n = 1; n <= TOTAL; n++) {
          var qid = "q" + n;
          var item = questionById(qid);
          var chosen = selections[qid];
          var correct = chosen === item.ans;
          if (correct) score += 1;

          var btns = document.querySelectorAll('.opt[data-qid="' + qid + '"]');
          btns.forEach(function (b) {
            b.disabled = true;
            var idx = parseInt(b.dataset.idx, 10);
            if (idx === item.ans) b.classList.add("is-correct");
            else if (idx === chosen) b.classList.add("is-wrong");
          });

          var fb = document.getElementById("fb-" + qid);
          fb.innerHTML = "";
          var v = document.createElement("span");
          v.className = "verdict " + (correct ? "ok" : "no");
          v.textContent = correct
            ? "✓ 回答正确"
            : "✗ 回答错误，正确答案是 " + LETTERS[item.ans];
          fb.appendChild(v);
          var why = document.createElement("span");
          why.className = "why";
          why.textContent = item.why;
          fb.appendChild(why);
          fb.classList.add("show");
        }

        document.getElementById("resultScore").textContent = score + " / " + TOTAL;
        document.getElementById("resultBand").textContent = "IELTS 估算：" + bandFor(score);
        resultEl.classList.add("show");
        submitBtn.disabled = true;
        resultEl.scrollIntoView({ behavior: "smooth", block: "start" });
      }

      function reset() {
        submitted = false;
        selections = {};
        document.querySelectorAll(".opt").forEach(function (b) {
          b.classList.remove("sel", "is-correct", "is-wrong");
          b.disabled = false;
        });
        document.querySelectorAll(".feedback").forEach(function (f) {
          f.classList.remove("show");
          f.innerHTML = "";
        });
        resultEl.classList.remove("show");
        updateProgress();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      build();
      updateProgress();
      submitBtn.addEventListener("click", submit);
      resetBtn.addEventListener("click", reset);
    </script>
  </body>
</html>
